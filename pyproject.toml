[project]
name = "img-seg"
version = "0.1.0"
description = "Course project for NIfTI image segmentation with nnU-Net v2, MONAI SegResNet, and EfficientNet-B0 based lightweight segmentation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "albumentations>=2.0.0",
    "gradio>=5.0.0",
    "matplotlib>=3.9.0",
    "monai>=1.4.0",
    "nibabel>=5.3.0",
    "nnunetv2>=2.5.0",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "segmentation-models-pytorch>=0.4.0",
    "timm>=1.0.0",
    "torch==2.5.1+cu121; sys_platform == 'win32' or sys_platform == 'linux'",
    "torch==2.5.1; sys_platform == 'darwin'",
    "torchvision==0.20.1+cu121; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision==0.20.1; sys_platform == 'darwin'",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
imgseg-audit-nifti = "img_seg.data.audit_cli:main"
imgseg-nnunet = "img_seg.training.nnunet_v2_cli:main"
imgseg-nnunet-report = "img_seg.evaluation.nnunet_report:main"
imgseg-visualize-overlay = "img_seg.evaluation.visualize:main"
imgseg-webui = "img_seg.webui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
