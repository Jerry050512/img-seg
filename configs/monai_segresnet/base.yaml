model_key: monai_segresnet
model_name: MONAI SegResNet
task:
  type: binary_segmentation
  input_format: nifti
data:
  dataset_config: configs/data/dataset.yaml
  split_file: configs/data/split_seed42.yaml
  roi_size: [96, 96, 64]
  spacing: [1.0, 1.0, 1.0]
  samples_per_volume: 2
  cache_rate: 0.0
  normalize_nonzero: true
model:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  init_filters: 16
  blocks_down: [1, 2, 2, 4]
  blocks_up: [1, 1, 1]
  dropout_prob: 0.1
  norm: INSTANCE
training:
  epochs: 200
  batch_size: 1
  workers: 0
  pin_memory: true
  amp: true
  seed: 42
  optimizer: adamw
  learning_rate: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  loss: dice_bce
  val_every: 10
  checkpoint_dir: checkpoints/monai_segresnet
  history_file: outputs/monai_segresnet/history.json
augmentation:
  positive_ratio: 1.0
  negative_ratio: 1.0
  image_threshold: 0.0
inference:
  sliding_window_batch_size: 4
  overlap: 0.5
  threshold: 0.5
  output_dir: outputs/monai_segresnet
runtime:
  device: auto
  cudnn_benchmark: true
notes:
  - Tune roi_size before increasing batch_size on RTX 4060 8GB.
  - Keep workers at 0 on Windows when shared-memory DataLoader failures occur.
