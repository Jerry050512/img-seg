model_key: monai_segresnet
model_name: MONAI SegResNet
task:
  type: binary_segmentation
  input_format: nifti
data:
  split_file: configs/data/split_seed42.yaml
  roi_size: [96, 96, 64]
  spacing: [1.0, 1.0, 1.0]
model:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  init_filters: 16
training:
  epochs: 200
  batch_size: 1
  amp: true
  optimizer: adamw
  learning_rate: 0.0002
  loss: dice_bce
inference:
  sliding_window_batch_size: 1
  overlap: 0.5
  threshold: 0.5
  output_dir: outputs/monai_segresnet
notes:
  - Tune roi_size before increasing batch_size on RTX 4060 8GB.
