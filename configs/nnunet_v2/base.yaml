model_key: nnunet_v2
model_name: nnU-Net v2
task:
  type: binary_segmentation
  input_format: nifti
paths:
  raw_dataset_dir: dataset
  nnunet_raw: dataset/processed/nnunet_raw
  nnunet_preprocessed: dataset/processed/nnunet_preprocessed
  nnunet_results: checkpoints/nnunet_v2
training:
  plans: auto
  trainer: nnUNetTrainer
  configurations:
    - 2d
    - 3d_lowres
  fold: 0
inference:
  output_dir: outputs/nnunet_v2
notes:
  - Start with 2d on RTX 4060 8GB, then try 3d_lowres if memory allows.
  - Keep nnU-Net's required folder structure generated by conversion scripts.
