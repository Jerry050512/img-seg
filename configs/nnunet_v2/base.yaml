model_key: nnunet_v2
model_name: nnU-Net v2
dataset:
  id: 501
  name: ImgSeg
  channel_names:
    "0": scan
  labels:
    background: 0
    target: 1
task:
  type: binary_segmentation
  input_format: nifti
paths:
  dataset_file: configs/data/dataset.yaml
  raw_dataset_dir: dataset
  nnunet_raw: dataset/processed/nnunet_raw
  nnunet_preprocessed: dataset/processed/nnunet_preprocessed
  nnunet_results: checkpoints/nnunet_v2
  split_file: configs/data/split_seed42.yaml
training:
  plans: auto
  trainer: nnUNetTrainer_200epochs
  configurations:
    - 2d
    - 3d_lowres
  fold: 0
runtime:
  nnunet_n_proc_da: 1
  nnunet_def_n_proc: 2
  nnunet_npp: 1
  nnunet_nps: 1
  nnunet_ext_trainer: src/img_seg/nnunet_ext_trainers
inference:
  output_dir: outputs/nnunet_v2
notes:
  - Start with 2d on RTX 4060 8GB, then try 3d_lowres if memory allows.
  - Keep nnU-Net's required folder structure generated by conversion scripts.
