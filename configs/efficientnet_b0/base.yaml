model_key: efficientnet_b0
model_name: 2D U-Net with EfficientNet-B0 encoder
task:
  type: binary_segmentation
  input_format: 2d_slices
data:
  raw_dataset_dir: dataset
  split_file: configs/data/split_seed42.yaml
  mask_overrides:
    1_23_XY: 1_23_XY.Seg.nii
    S_1: S-1-Seg.nii
  slice_axis: z
  image_size: [512, 512]
  foreground_slice_keep_ratio: 1.0
  empty_slice_keep_ratio: 0.25
model:
  library: segmentation_models_pytorch
  architecture: Unet
  encoder_name: efficientnet-b0
  encoder_weights: imagenet
  in_channels: 1
  classes: 1
training:
  seed: 42
  epochs: 100
  batch_size: 8
  amp: true
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  loss: dice_bce
  log_file: outputs/efficientnet_b0/train.log
runtime:
  device: auto
  num_workers: 0
  nifti_cache_size: 8
checkpoints:
  output_dir: checkpoints/efficientnet_b0
  best: checkpoints/efficientnet_b0/best.pth
inference:
  threshold: 0.5
  batch_size: 8
  amp: true
  output_dir: outputs/efficientnet_b0
notes:
  - This is the lightweight/WebUI-friendly baseline.
  - Reconstruct NIfTI masks slice-by-slice for volume inference.
