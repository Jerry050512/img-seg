model_key: efficientnet_b0
model_name: 2D U-Net with EfficientNet-B0 encoder
task:
  type: binary_segmentation
  input_format: 2d_slices
data:
  split_file: configs/data/split_seed42.yaml
  slice_axis: z
  image_size: [512, 512]
  foreground_slice_keep_ratio: 1.0
  empty_slice_keep_ratio: 0.25
model:
  library: segmentation_models_pytorch
  architecture: Unet
  encoder_name: efficientnet-b0
  encoder_weights: imagenet
  in_channels: 1
  classes: 1
training:
  epochs: 100
  batch_size: 8
  amp: true
  optimizer: adamw
  learning_rate: 0.0003
  loss: dice_bce
inference:
  threshold: 0.5
  output_dir: outputs/efficientnet_b0
notes:
  - This is the lightweight/WebUI-friendly baseline.
  - Reconstruct NIfTI masks slice-by-slice for volume inference.
