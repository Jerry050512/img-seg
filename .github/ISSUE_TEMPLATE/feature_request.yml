name: Feature request
description: 提议新功能、改进或实验支持
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与目标
      description: 这个功能想解决什么问题？和课程验收、模型对比或 WebUI 工作流有什么关系？
      placeholder: 目前批量推理缺少...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望的行为、接口、配置或文档变化。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 数据处理
        - 模型训练
        - 推理接口
        - 评估与可视化
        - WebUI
        - 文档或协作流程
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 如果已有临时做法或替代路径，请写在这里。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我确认这个提议不会要求提交原始数据、训练权重或预测结果到 Git。
          required: true
        - label: 我已搜索现有 issue，确认不是明显重复提议。
          required: true
